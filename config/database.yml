default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("PGUSER", "lucasm") %>
  password: <%= ENV.fetch("PGPASSWORD", "") %>
  
  host: <%= ENV["PGHOST"] %>
  port: <%= ENV["PGPORT"] %>

development:
  <<: *default
  database: plataforma_monitoria_development

test:
  <<: *default
  database: plataforma_monitoria_test

production:
  <<: *default
  database: plataforma_monitoria_production
  username: <%= ENV.fetch("DATABASE_USERNAME", "plataforma_monitoria") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>